services:
  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - sqlite_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"

volumes:
  sqlite_data:
